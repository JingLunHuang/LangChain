name: OmniAgent Platform CI

on:
  push:
    paths: ['agent-platform/**', '.github/workflows/agent-platform.yml']
  pull_request:
    paths: ['agent-platform/**', '.github/workflows/agent-platform.yml']

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent-platform
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
          cache-dependency-glob: agent-platform/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m compileall -q core platform_api mcp_server examples
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: agent-platform/dist/
          if-no-files-found: error
