[project]
name = "agent-platform"
version = "0.1.0"
description = "MCP-first Agent platform with hybrid retrieval and cache-aware context management"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langchain>=1.0,<2",
    "langchain-community>=0.4,<0.5",
    "langchain-openai>=1,<2",
    "dashscope>=1.24,<2",
    "llama-index-core>=0.14,<0.15",
    "llama-index-llms-openai-like>=0.5,<0.6",
    "llama-index-embeddings-openai>=0.5,<0.6",
    "mcp>=1.28,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "rank-bm25>=0.2.2,<0.3",
    "tiktoken>=0.9,<1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pytest-timeout",
    "pypdf>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "mcp_server",
    "core",
    "platform_api",
    "examples",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 90

[tool.hatch.build.targets.sdist]
include = [
    "/core", "/platform_api", "/mcp_server", "/examples", "/scripts",
    "/docs", "/tests", "/.github", "/README.md", "/LICENSE", "/TASKS.md",
    "/pyproject.toml", "/uv.lock", "/.env.example", "/.gitignore",
    "/reports/*.json", "/reports/verification.md",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".uv-cache", ".test-tmp*", ".codex-pytest-cache", "dist", ".state"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC"]
