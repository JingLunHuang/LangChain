[project]
name = "agent-platform"
version = "0.2.0"
description = "OmniAgent: explainable task-to-model routing, MCP and hybrid retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langchain>=1.0,<2",
    "langgraph>=1,<2",
    "langchain-community>=0.4,<0.5",
    "langchain-openai>=1,<2",
    "dashscope>=1.24,<2",
    "llama-index-core>=0.14,<0.15",
    "llama-index-llms-openai-like>=0.5,<0.6",
    "llama-index-embeddings-openai>=0.5,<0.6",
    "mcp>=1.28,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "rank-bm25>=0.2.2,<0.3",
    "tiktoken>=0.9,<1",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[project.scripts]
omniagent = "core.model_routing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "mcp_server",
    "core",
    "platform_api",
    "edge_reasoner",
    "examples",
]

[tool.hatch.build.targets.wheel.force-include]
"data" = "edge_reasoner/data"

[tool.hatch.build.targets.sdist]
include = [
    "/core", "/platform_api", "/mcp_server", "/examples", "/scripts",
    "/edge_reasoner", "/data", "/images", "/EDGE_REASONER.md",
    "/requirements-edge-base.txt", "/requirements-edge-train.txt",
    "/README.md", "/PROJECT_OVERVIEW.md", "/LICENSE",
    "/models.example.json", "/assets",
    "/pyproject.toml", "/uv.lock", "/.env.example", "/.gitignore",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".uv-cache", "dist", ".state"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC"]
